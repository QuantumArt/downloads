# Имя проекта compose — обязательно задано явно.
#
# Без него compose берёт имя из basename каталога с compose-файлом, а каталог у
# этого проекта называется `site/`. На этом же VPS в каталогах `site/` лежат
# другие проекты, и без явного имени они все назывались бы `site`. Compose
# считает контейнеры с одинаковым именем проекта принадлежащими одному
# проекту и показывает чужие как «сироты»:
#
#   WARN[0000] Found orphan containers (nuget-baget) for this project.
#
# Сама надпись безобидна, но опасна в действии: `docker compose down
# --remove-orphans` (или `up -d --remove-orphans`) удалил бы контейнер
# nuget-baget — приватный NuGet-фид на 127.0.0.1:3022. Кроме того, `down`
# удаляет и общую сеть проекта, а чужие контейнеры на ней висят.
#
# Имя проекта должно совпадать с именем каталога-владельца (downloads), а не
# с названием папки site/.
name: downloads

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: downloads-web:latest
    container_name: downloads-web
    restart: unless-stopped
    # 127.0.0.1 — как у остальных сайтов на этом VPS: наружу торчит только
    # хостовый nginx (TLS + reverse proxy), контейнер слушает только локально.
    # Порт 3021 — соседний с sidus (3020). Занятые на момент настройки:
    # 3001, 3010, 3020, 5000, 7700, 8090, 9117. Проверь `docker ps` перед
    # первым запуском на случай, если что-то изменилось.
    ports:
      - "127.0.0.1:3021:80"
    # Логи nginx в файлы на хосте. Volume перекрывает каталог /var/log/nginx
    # из образа (там симлинки на stdout), поэтому пишем в настоящие файлы.
    # Без этого логи жили бы только в `docker logs` и пропали бы при каждом
    # `up -d --force-recreate`.
    #
    # Каталог НЕ в /tmp: /tmp чистится при перезагрузке и не предназначен для
    # постоянных данных. По умолчанию системное /var/log/downloads — логи
    # лежат рядом с логами хостового nginx и переживают всё, включая снос
    # самого каталога проекта. Переопределяется переменной DL_LOGS_DIR.
    # Docker создаёт каталог при первом запуске, владельцем будет root.
    volumes:
      - ${DL_LOGS_DIR:-/var/log/downloads}:/var/log/nginx
    healthcheck:
      # 127.0.0.1, а не localhost — см. комментарий в Dockerfile: localhost
      # резолвится в ::1, nginx слушает только IPv4.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
