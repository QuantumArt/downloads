services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: downloads-web:latest
    container_name: downloads-web
    restart: unless-stopped
    # 127.0.0.1 — как у остальных сайтов на этом VPS: наружу торчит только
    # хостовый nginx (TLS + reverse proxy), контейнер слушает только локально.
    # Порт 3021 — соседний с sidus (3020). Занятые на момент настройки:
    # 3001, 3010, 3020, 5000, 7700, 8090, 9117. Проверь `docker ps` перед
    # первым запуском на случай, если что-то изменилось.
    ports:
      - "127.0.0.1:3021:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
