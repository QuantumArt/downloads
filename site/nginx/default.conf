# nginx внутри контейнера — отдаёт статику из dist/.
# TLS и проксирование с домена — на хостовом nginx (см. ../nginx/downloads).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/xml+rss;

    error_page 404 /404.html;

    # Контейнер стоит за хостовым nginx, который терминирует TLS. Внутренний
    # nginx видит только http и не знает про реальную схему, поэтому по
    # умолчанию он собирает абсолютный редирект вида http://<host>/archive/
    # — браузер получил бы понижение с https на http. Относительные
    # редиректы браузер разрешает сам, сохраняя и схему, и хост.
    absolute_redirect off;

    # Продуктовые страницы. Оригинал (ASP.NET) отдаёт 200 и со слэшем, и без:
    #   /QP8, /archive/, /archive, /Angular/ — все 200.
    # Статике нужна явная цепочка поиска: сам путь, потом .html, потом каталог.
    #
    # Важно: вариант «$uri/index.html» здесь НЕ работает — при $uri, уже
    # заканчивающемся на слэш, получается /Angular//index.html, и все
    # каталоговые страницы отдают главную. Поэтому каталог подставляем как
    # «$uri/», а index.html к нему добавляет директива index.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # HTML — не кешировать (содержимое может обновиться между деплоями)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # CSS/JS на неизменных путях — можно кешировать надолго
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Шрифты/иконки — меняются редко
    location ~* \.(?:woff2?|ttf|svg|png|jpe?g|webp|ico|pdf)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
}
