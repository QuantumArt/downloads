# nginx внутри контейнера — отдаёт статику из dist/.
# TLS и проксирование с домена — на хостовом nginx (см. ../nginx/downloads).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Логи пишем в ФАЙЛЫ, а не в stdout. В образе nginx:alpine путь
    # /var/log/nginx/access.log — симлинк на /dev/stdout, поэтому `docker logs`
    # работал бы, но эти логи удалялись бы при каждом пересоздании контейнера
    # (`up -d --force-recreate` в deploy.sh). Volume поверх /var/log/nginx
    # перекрывает симлинки, и логи становятся обычными файлами на хосте.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/xml+rss;

    error_page 404 /404.html;

    # Контейнер стоит за хостовым nginx, который терминирует TLS. Внутренний
    # nginx видит только http и не знает про реальную схему, поэтому по
    # умолчанию он собирает абсолютный редирект вида http://<host>/archive/
    # — браузер получил бы понижение с https на http. Относительные
    # редиректы браузер разрешает сам, сохраняя и схему, и хост.
    absolute_redirect off;

    # Продуктовые страницы. Оригинал (ASP.NET) отдаёт 200 и со слэшем, и без:
    #   /QP8, /archive/, /archive, /Angular/ — все 200.
    # Статике нужна явная цепочка поиска: сам путь, потом .html, потом каталог.
    #
    # Важно: вариант «$uri/index.html» здесь НЕ работает — при $uri, уже
    # заканчивающемся на слэш, получается /Angular//index.html, и все
    # каталоговые страницы отдают главную. Поэтому каталог подставляем как
    # «$uri/», а index.html к нему добавляет директива index.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Продуктовые страницы: шесть разложены файлами (QP8.html, QP8_PG.html,
    # DPC.html, Widgets.html, search.html, QP79.html), шесть — каталогами
    # (archive/, GraphQL/, Angular/, React/, DPC.Impact/, DPC.PdfGenerator/).
    #
    # Оригинал (ASP.NET) отдаёт 200 по обоим вариантам каждого URL:
    #   /archive и /archive/, /QP8 и /QP8/, /DPC и /DPC/ — все 200.
    # Статика так не умеет: каталог без слэша nginx уводит редиректом 301,
    # а файл с каталоговым URL (/DPC/) вообще не находится — 404.
    #
    # Поэтому страницы перечислены явно, и для обоих вариантов ищем
    # одноимённый index.html, затем одноимённый .html. Список закрытый,
    # чтобы правило не перехватывало ассеты (/favicon.ico и подобные).
    #
    # Порядок важен: блок идёт до «~* \.html$», иначе внутренний редирект
    # на /DPC.html перехватит правило кеширования HTML.
    location ~ ^/(?<page>archive|GraphQL|Angular|React|DPC\.Impact|DPC\.PdfGenerator|QP8|QP8_PG|DPC|Widgets|search|QP79)/?$ {
        try_files /$page/index.html /$page.html =404;
    }

    # Прямые .html на оригинале не отдаются: ASP.NET знает только маршруты
    # /QP8, /archive/, /DPC/, ... — на /QP8.html отвечает 404. Зеркало
    # хранит страницы файлами, поэтому без этого правила лишние URL
    # (/QP8.html, /index.html, /archive/index.html) отвечали бы 200.
    # internal пропускает только внутренние редиректы — в том числе те, что
    # делает try_files, и error_page 404 -> /404.html; внешние запросы
    # получают 404, как на оригинале.
    #
    # Каталоги ассетов (css/, js/, fonts/, img/, images/) на оригинале дают
    # 404 — ASP.NET их не знает. В статике nginx на каталог без index.html
    # отвечает 403 (autoindex выключен), поэтому закрываем каталоги явно.
    location ~ ^/(?:css|js|fonts|img|images)/$ {
        return 404;
    }

    # HTML — не кешировать (содержимое может обновиться между деплоями).
    location ~* \.html$ {
        internal;
        add_header Cache-Control "no-cache";
    }

    # CSS/JS на неизменных путях — можно кешировать надолго
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Шрифты/иконки — меняются редко
    location ~* \.(?:woff2?|ttf|svg|png|jpe?g|webp|ico|pdf)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
}
