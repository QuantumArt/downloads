# nginx внутри контейнера — отдаёт статику из dist/.
# TLS и проксирование с домена — на хостовом nginx (см. ../nginx/downloads).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/xml+rss;

    error_page 404 /404.html;

    # /archive/ — это каталог с index.html, а не файл archive.html.
    # Без этого блока nginx отдаст 301 на /archive и внешний тест увидит редирект
    # вместо 200, хотя страница на месте.
    location = /archive {
        return 301 /archive/;
    }

    # HTML — не кешировать (содержимое может обновиться между деплоями)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # CSS/JS на неизменных путях — можно кешировать надолго
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Шрифты/иконки — меняются редко
    location ~* \.(?:woff2?|ttf|svg|png|jpe?g|webp|ico|pdf)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
}
